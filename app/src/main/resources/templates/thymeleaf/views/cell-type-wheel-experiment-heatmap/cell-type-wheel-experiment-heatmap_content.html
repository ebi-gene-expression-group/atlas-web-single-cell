<div id="cellTypeWheelHeatmap"></div>
<link rel="stylesheet" href="https://ebi.emblstatic.net/web_guidelines/EBI-Icon-fonts/v1.3/fonts.css" type="text/css"
      media="all"/>

<script defer th:src="@{/resources/js-bundles/cellTypeWheelHeatmap.bundle.js}"></script>

<script th:inline="javascript" th:with="contextPath=@{/}">
  const contextPath = /*[[${contextPath}]]*/ '';
  const cellTypeWheelSearchTerm = /*[[${cellTypeWheelSearchTerm}]]*/ '';
  const species = /*[[${species}]]*/ '';

  document.addEventListener('DOMContentLoaded', function () {
    cellTypeWheelHeatmap.render(
      {
        host: contextPath,
        searchTerm: cellTypeWheelSearchTerm,
        species: species
      },
      'cellTypeWheelHeatmap');
  });
</script>
