<style>
    #gene-search, #feedback-button {
        display: inline;
    }
    #feedback-button h1 {
        color: black;
    }
</style>

<div class="row column expanded">
    <div id="gene-search"></div>
</div>

<div id="feedback-button"></div>

<link rel="stylesheet" th:href="@{/resources/css/react-popup.css}" type="text/css" media="all">
<link rel="stylesheet" href="https://ebi.emblstatic.net/web_guidelines/EBI-Icon-fonts/v1.3/fonts.css" type="text/css" media="all" />

<script defer th:src="@{/resources/js-bundles/feedbackForm.bundle.js}"></script>

<script defer th:src="@{/resources/js-bundles/geneSearch.bundle.js}"></script>

<script th:inline="javascript" th:with="contextPath=@{/}">
  const contextPath = /*[[${contextPath}]]*/ '';
  document.addEventListener("DOMContentLoaded", function() {
    geneSearch.render({
      atlasUrl: contextPath,
      basename: contextPath,
    }, 'gene-search');
    feedbackForm.render({
      feedbackFormLink: 'https://www.ebi.ac.uk/support/gxasc',
      gaId: 'UA-37676851-3'
    }, 'feedback-button');
  });
</script>
