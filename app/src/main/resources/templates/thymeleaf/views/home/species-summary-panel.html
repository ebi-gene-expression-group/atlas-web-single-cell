<div id="species-summary-panel"></div>

<div class="row expanded column text-center margin-top-medium">
  <a class="button primary" th:href="@{/experiments}">Show experiments of all species</a>
</div>

<script defer th:src="@{/resources/js-bundles/homepageSpeciesSummaryPanel.bundle.js}"></script>

<script th:with="contextPath=@{/}">
  document.addEventListener('DOMContentLoaded', function() {
    var sliderSettings = {
      dots: true,
      infinite: false,
      speed: 500,
      slidesToShow: 6,
      slidesToScroll: 6,
      adaptiveHeight: true,
      autoplay: false,
      autoplaySpeed: 2000,
      responsive: [
        {
          breakpoint: 1024,
          settings: {
            slidesToShow: 3,
            slidesToScroll: 3,
            infinite: true,
            dots: true
          }
        },
        {
          breakpoint: 600,
          settings: {
            slidesToShow: 2,
            slidesToScroll: 2,
            dots: true
          }
        },
        {
          breakpoint: 480,
          settings: {
            slidesToShow: 1,
            slidesToScroll: 1,
            dots: true
          }
        }
      ]
    };

    homepageSpeciesSummaryPanel.render({
        host: '$contextPath',
        resource: 'json/species-summary?limit=100',
        carouselCardsRowProps: {
          className: 'row expanded small-up-2 medium-up-3 large-up-6',
          cardContainerClassName: 'column',
          sliderSettings: sliderSettings,
          containerHeight: '320px',
          sliderHeight: '300px'
        },
        onComponentDidMount: function() {
          $('#species-summary-panel').foundation();
          $('#species-summary-panel').foundationExtendEBI();
        }
      },
      'species-summary-panel');
  })
</script>
