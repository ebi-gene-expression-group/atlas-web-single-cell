version: "3.6"

services:
  node-webpack:
    image: node:16
    volumes:
      - ..:/root/project
    working_dir: /root/project
    command: ["sh", "-c", "set -e && export CPPFLAGS=-DPNG_ARM_NEON_OPT=0 && if echo \"${FRONTEND_BUILD_FLAGS:--i}\" | grep -q -- '^-u\\| -u'; then npm install -g npm-check-updates@16; fi && ./compile-front-end-packages.sh ${FRONTEND_BUILD_FLAGS:--i}" ]

  gradle-build:
    depends_on:
      node-webpack:
        condition: service_completed_successfully
    extends:
      service: gradle
      file: docker-compose-gradle.yml
    ports:
      - "5005:5005"
    command: ["sh", "-c", "gradle clean :app:war"]

  gradle-shell:
    extends:
      service: gradle
      file: docker-compose-gradle.yml
    tty: true
    stdin_open: true
    command: [ "sh", "-c", "gradle && /bin/bash" ]
    depends_on:
      gradle-build:
        condition: service_completed_successfully
    ports:
      - "5006:5005"
